plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.temporal'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def compilerDirectory = providers.environmentVariable('CARGO_JVM_BACKEND_PATH')
    .map { file(it) }
    .orElse(layout.projectDirectory.dir('.deps/compiler').asFile)
def cargoJvm = compilerDirectory.map { new File(it, 'cargo-jvm/target/release/cargo-jvm') }
def cargoJvmConfig = providers.environmentVariable('CARGO_JVM_CONFIG')
    .orElse(layout.projectDirectory.file('.deps/cargo-jvm.toml').asFile.absolutePath)
def coreJar = layout.buildDirectory.file('bridge.jar')
def coreRustFlags = 'build.rustflags = ["--cfg", "getrandom_backend=\\"custom\\""]'

def buildJvmCompiler = tasks.register('buildJvmCompiler', Exec) {
    description = 'Builds the pinned rustc_codegen_jvm checkout when needed.'
    onlyIf { !cargoJvm.get().canExecute() }
    doFirst {
        workingDir compilerDirectory.get()
        commandLine 'python3', 'build.py', 'all'
    }
}

def packageJvmCore = tasks.register('packageJvmCore', Exec) {
    description = 'Compiles SDK Core and the Rust bridge to JVM bytecode.'
    dependsOn buildJvmCompiler

    inputs.files(fileTree('bridge') { exclude 'target/**' })
    ['sdk-rust', 'http', 'tonic'].each { dependency ->
        inputs.files(fileTree(".deps/${dependency}") {
            exclude '.git/**', 'target/**'
        })
    }
    inputs.files(compilerDirectory.map { directory ->
        fileTree(directory) {
            include 'cargo-jvm/target/release/cargo-jvm', 'config.toml', 'jvm-unknown-jvm.json',
                'java-linker/target/release/java-linker', 'runtime/build/libs/*.jar',
                'target/release/*rustc_codegen_jvm*', 'std/**'
        }
    })
    inputs.files(cargoJvmConfig.map { file(it) })
    inputs.property('coreRustFlags', coreRustFlags)
    outputs.file(coreJar)

    doFirst {
        File output = coreJar.get().asFile
        output.parentFile.mkdirs()
        environment 'CARGO_JVM_BACKEND_PATH', compilerDirectory.get().absolutePath
        environment 'CARGO_JVM_CONFIG', cargoJvmConfig.get()
        commandLine cargoJvm.get().absolutePath, 'package', '--locked',
            '--manifest-path', 'bridge/Cargo.toml', '--lib', '--output', output.absolutePath,
            '--config', coreRustFlags
    }
}

configurations {
    protocCompiler
    grpcCodeGenerator
    protobufIncludes
}

def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def architecture = System.getProperty('os.arch')
def arm64 = architecture in ['arm64', 'aarch64']
def protoPlatform = os.contains('mac') ? 'osx' : os.contains('linux') ? 'linux' : 'windows'
def classifier = "${protoPlatform}-${arm64 ? 'aarch_64' : 'x86_64'}"

dependencies {
    api platform('io.grpc:grpc-bom:1.76.0')
    api 'io.grpc:grpc-api'
    api 'io.grpc:grpc-stub'
    implementation 'io.grpc:grpc-protobuf'
    api 'io.grpc:grpc-netty-shaded'
    api 'io.grpc:grpc-services'
    api 'io.grpc:grpc-inprocess'
    api 'com.google.protobuf:protobuf-java-util:3.25.8'
    api 'com.uber.m3:tally-core:0.13.0'
    api 'org.slf4j:slf4j-api:1.7.36'
    api 'io.micrometer:micrometer-core:1.9.9'
    api 'io.nexusrpc:nexus-sdk:0.4.0-alpha'
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    api 'com.google.code.gson:gson:2.10.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.2'
    implementation 'com.google.guava:guava:32.0.1-jre'
    compileOnly 'com.jayway.jsonpath:json-path:2.9.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly files(packageJvmCore)

    protobufIncludes 'com.google.protobuf:protobuf-java:3.25.8'
    protocCompiler "com.google.protobuf:protoc:3.25.8:${classifier}@exe"
    grpcCodeGenerator "io.grpc:protoc-gen-grpc-java:1.76.0:${classifier}@exe"
}

def protos = layout.projectDirectory.dir('.deps/sdk-rust/crates/protos/protos')
def protoRoots = ['local', 'api_upstream', 'api_cloud_upstream', 'testsrv_upstream']
    .collect { protos.dir(it).asFile }
def protoSources = files(protoRoots.collect { root ->
    fileTree(root) {
        include 'temporal/**/*.proto', 'nexusannotations/**/*.proto'
    }
}, fileTree(protos.asFile) {
    include 'protoc-gen-openapiv2/**/*.proto'
})
def generatedProtos = layout.buildDirectory.dir('generated/protos')
def generateTemporalProtos = tasks.register('generateTemporalProtos') {
    description = 'Generates typed Java messages and service stubs from the pinned Core schemas.'
    inputs.files(protoSources, configurations.protocCompiler, configurations.grpcCodeGenerator,
        configurations.protobufIncludes)
    inputs.files(fileTree(protos.asFile) {
        include 'api_upstream/google/**/*.proto', 'google/rpc/**/*.proto'
    })
    outputs.dir(generatedProtos)
    doLast {
        File output = generatedProtos.get().asFile
        delete(output)
        output.mkdirs()
        File compiler = configurations.protocCompiler.singleFile
        File grpc = configurations.grpcCodeGenerator.singleFile
        File executableDir = temporaryDir
        copy {
            from compiler, grpc
            into executableDir
            filePermissions { unix('rwxr-xr-x') }
        }
        File standardProtos = new File(temporaryDir, 'includes')
        copy {
            from zipTree(configurations.protobufIncludes.singleFile)
            include 'google/protobuf/*.proto'
            into standardProtos
        }
        def includePaths = (protoRoots + [protos.asFile, standardProtos]).collect { "-I${it.absolutePath}" }
        def sources = protoSources.files.collect { it.absolutePath }.sort()
        project.exec {
            executable new File(executableDir, compiler.name).absolutePath
            args includePaths
            args "--java_out=${output.absolutePath}", "--grpc-java_out=${output.absolutePath}"
            args "--plugin=protoc-gen-grpc-java=${new File(executableDir, grpc.name).absolutePath}"
            args sources
        }
    }
}
sourceSets.main.java.srcDir('src/sdk-java/java')
sourceSets.main.java.srcDir(generateTemporalProtos)
tasks.named('compileJava', JavaCompile) {
    options.fork = true
    options.forkOptions.memoryMaximumSize = '2g'
}

def javaLauncher = javaToolchains.launcherFor(java.toolchain)
def sdkRuntime = files(tasks.named('jar', Jar).flatMap { it.archiveFile }, configurations.runtimeClasspath)
def verifySdkJava = tasks.register('verifySdkJava', Exec) {
    description = 'Verifies the checked-in SDK Java sources and the Core workflow context contract.'
    group = 'verification'
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'python3', 'verify_sdk_java.py',
            '--classpath', sdkRuntime.asPath,
            '--java', javaLauncher.get().executablePath.asFile.absolutePath
    }
}

tasks.register('verifyCoreActivations', Exec) {
    description = 'Tests Core workflow activation adapters and replay on a local Temporal server.'
    group = 'verification'
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'python3', 'probes/verify_core_activations.py',
            '--classpath', sdkRuntime.asPath,
            '--java', javaLauncher.get().executablePath.asFile.absolutePath
    }
}

tasks.named('check') {
    dependsOn verifySdkJava
}

def versionResource = layout.buildDirectory.file('generated/resources/io/temporal/version.properties')
def writeSdkVersion = tasks.register('writeSdkVersion') {
    inputs.property('version', project.version.toString())
    outputs.file(versionResource)
    doLast {
        File output = versionResource.get().asFile
        output.parentFile.mkdirs()
        output.text = "temporal-client-version=${project.version}\n"
    }
}

tasks.named('processResources') {
    from(writeSdkVersion) { into 'io/temporal' }
    into('META-INF') {
        from('LICENSE') { rename { 'LICENSE.sdk-java-poc' } }
        from('LICENSE.sdk-java')
    }
}

tasks.named('jar', Jar) {
    dependsOn packageJvmCore
    // The compiled Core has more entries than the standard ZIP limit.
    zip64 = true
    from({ zipTree(coreJar.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}

publishing {
    publications {
        poc(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'poc'
            url = layout.buildDirectory.dir('maven-repository')
        }
    }
}
